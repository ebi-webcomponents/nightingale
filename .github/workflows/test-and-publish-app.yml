name: Test and Publish Nightingale App

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
      # The repo has no `packageManager` field: setting it makes pnpm install
      # itself into the workspace and write a two-document pnpm-lock.yaml,
      # which the nx bundled with lerna 8 cannot parse. Pin the version here
      # instead.
      - uses: pnpm/action-setup@v4.1.0
        with:
          version: 12.4.2
      - uses: actions/setup-node@v6.3.0
        with:
          node-version: 24
          cache: pnpm
      - name: 🔧 Install
        run: |
          pnpm install --frozen-lockfile
      - name: 🔧 Build
        run: |
          pnpm clean
          pnpm build
      - name: 🧪 Test - Unit
        run: |
          pnpm test
      - name: 🧪 Test - Lint
        run: |
          pnpm lint
      - name: 📚 Storybook
        run: |
          pnpm build-storybook
      - name: 🚀 Deploy Storybook
        if: github.ref == 'refs/heads/main'
        uses: JamesIves/github-pages-deploy-action@v4.6.8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          branch: gh-pages # The branch the action should deploy to.
          folder: storybook-static # The folder the action should deploy.
          clean: true
      - name: 📟 Building V3
        if: github.ref == 'refs/heads/main'
        run: |
          gh workflow run test-and-publish-app.yml --ref v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
